[project]
name = "elt-bench-rl"
version = "0.1.0"
description = "RLVR environment for ELT-Bench, built on tinker-cookbook"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "pyyaml>=6",
    "pandas>=2.1",
    "tinker-cookbook>=0.7.1",
    "snowflake-connector-python[pandas]>=5.2.0",
    "dbt-snowflake>=1.12.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elt_env"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
